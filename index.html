<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7cff">
<link rel="manifest" href="manifest.json">
<title>SHI AC CAL</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f7fb;color:#102033}
.wrap{max-width:520px;margin:auto;padding:22px 18px 40px}
.card{background:white;border-radius:24px;padding:22px;box-shadow:0 8px 30px #00000012}
h1{margin:0;font-size:30px} .sub{color:#64748b;margin:5px 0 22px}
label{display:block;font-weight:700;margin:15px 0 7px}
input,select{width:100%;padding:14px;border:1px solid #d7e0ea;border-radius:13px;font-size:17px;background:#fff}
button{width:100%;border:0;border-radius:15px;padding:16px;margin-top:20px;background:#0b7cff;color:#fff;font-size:18px;font-weight:800}
.result{display:none;margin-top:20px;background:#eaf4ff;border-radius:18px;padding:18px}
.btu{font-size:34px;font-weight:900;color:#0867d8}.capacity{font-size:22px;font-weight:800;margin-top:5px}
.small{font-size:13px;color:#64748b;margin-top:12px;line-height:1.45}
.brand{display:inline-block;background:#0b7cff;color:#fff;border-radius:10px;padding:6px 10px;font-weight:900;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">SHI AC CAL</div>
    <h1>AC BTU Calculator</h1>
    <div class="sub">Find a suitable AC capacity from your room size.</div>

    <label>Room Length (ft)</label>
    <input id="length" type="number" min="1" step="0.1" placeholder="Example: 12">

    <label>Room Width (ft)</label>
    <input id="width" type="number" min="1" step="0.1" placeholder="Example: 15">

    <label>Number of people</label>
    <input id="people" type="number" min="1" value="2">

    <label>Sun exposure</label>
    <select id="sun">
      <option value="0">Normal</option>
      <option value="10">High sunlight</option>
      <option value="20">Very high sunlight / top floor</option>
    </select>

    <button onclick="calculate()">CALCULATE BTU</button>

    <div id="result" class="result">
      <div>Recommended minimum</div>
      <div id="btu" class="btu"></div>
      <div id="cap" class="capacity"></div>
      <div id="area"></div>
      <div class="small">Estimate only. Actual AC sizing can vary with ceiling height, insulation, windows, heat sources and local climate.</div>
    </div>
  </div>
</div>
<script>
function calculate(){
  const L=parseFloat(document.getElementById('length').value);
  const W=parseFloat(document.getElementById('width').value);
  const P=Math.max(1,parseInt(document.getElementById('people').value)||1);
  const sun=parseInt(document.getElementById('sun').value)||0;
  if(!L||!W||L<=0||W<=0){alert("Please enter room length and width.");return;}
  const area=L*W;
  // Practical quick estimate: 20 BTU/sq.ft baseline, plus occupants and sunlight.
  let btu=area*20 + Math.max(0,P-2)*600;
  btu *= (1 + sun/100);
  const sizes=[9000,12000,18000,24000,30000,36000,48000];
  const rec=sizes.find(x=>x>=btu)||48000;
  document.getElementById('btu').textContent=Math.round(btu).toLocaleString()+" BTU/hr";
  document.getElementById('cap').textContent="Recommended AC: "+rec.toLocaleString()+" BTU";
  document.getElementById('area').textContent="Room area: "+area.toFixed(1)+" sq.ft";
  document.getElementById('result').style.display="block";
}
</script>
</body>
</html>
